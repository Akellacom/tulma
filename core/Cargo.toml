[workspace]
resolver = "3"
members = ["crates/tulma-core", "crates/tulma"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tulma-core = { path = "crates/tulma-core" }
rmcp = { version = "3.5.1", default-features = false, features = [
  "base64", "macros", "server", "client",
  "transport-streamable-http-server", "transport-child-process",
  "transport-streamable-http-client-reqwest", "transport-io", "reqwest",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
security-framework = "3"
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex-lite = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
process-wrap = { version = "10", features = ["tokio1"] }
futures = "0.3"
anyhow = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
